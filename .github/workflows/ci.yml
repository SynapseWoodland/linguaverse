name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 只跑受改动影响的作业：client/** 触发前端，server/** 触发后端。
# workflow_dispatch（手动）时强制运行全部作业，便于基线校验。
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      run_all: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.run_all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:run
      - name: Build
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.run_all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Unit tests (no Docker)
        run: mvn -B test

  # 集成测试：需 Docker（GitHub runner 自带），走 Testcontainers 起 MySQL。
  # 默认非阻断（continue-on-error），需要设为必过时移除该行。
  backend-it:
    needs: [changes, backend]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.run_all == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Integration tests (Testcontainers)
        run: mvn -B verify -Pit
