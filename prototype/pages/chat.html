<!DOCTYPE html>

<head>

<body data-shell="app" data-nav="home" data-phase="1">
<div style="max-width:720px;margin:0 auto;display:flex;flex-direction:column;height:100vh;padding:16px 20px 0">
  <div class="row-between">
    <a class="tiny muted" href="messages-list.html">← 私信列表</a>
    <a href="profile-user.html" class="row gap-sm small"><span class="avatar ja sm" style="width:24px;height:24px;font-size:11px">芽</span><b>樱芽めい</b></a>
    <a class="tiny muted" href="report.html">举报</a>
  </div>

  <div class="col gap-md mt-lg" style="flex:1;overflow:auto;padding:6px 0 14px">
    <div class="row gap-sm"><span class="avatar ja sm" style="width:26px;height:26px;font-size:11px">芽</span><div class="bubble other">看了你评论里的造句问题，が用在强调动作主体的时候超常见的～</div></div>
    <div class="bubble me">懂了一点点… 那「だれが来ますか」为什么用が？</div>
    <div class="row gap-sm"><span class="avatar ja sm" style="width:26px;height:26px;font-size:11px">芽</span><div class="bubble other">因为你在问"谁"做这个动作，重点是主语本身，所以用が！你想强调哪个，哪个就用が（超简化版哈哈）</div></div>
    <div class="bubble me">那我造三个句子发你，你帮我看看？</div>
    <div class="row gap-sm"><span class="avatar ja sm" style="width:26px;height:26px;font-size:11px">芽</span><div class="bubble other">好呀，尽管发～ 错了也没关系，我学的时候被笑过一百遍</div></div>
    <div class="bubble me">ははは、ありがとう！那我把自己造的三个句子发你，你帮我看看对不对～</div>
    <p class="tiny muted" style="align-self:center;margin-top:4px">今天 14:31 · 已送达</p>
  </div>

  <div class="row gap-md" style="padding:10px 0 20px;border-top:var(--hairline);padding-top:12px">
    <input class="input" placeholder="发条友善的私信…">
    <button class="btn btn-stamp" data-mark="原型示意：发送私信">发送</button>
  </div>
</div>
