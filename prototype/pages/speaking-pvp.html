<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口语 PK · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-phase="2">
<div style="max-width:760px;margin:0 auto;padding:36px 22px 70px">
  <div class="row-between">
    <a class="tiny muted" href="home.html">← 返回</a>
    <span class="mini-phase mini-2">P2 玩法</span>
  </div>

  <h1 class="serif-cn center mt-md" style="font-size:28px">口语 PK · 一分钟擂台</h1>
  <p class="muted small center mt-md">系统给出同一句，你和对手分别跟读，发音分高者胜。胜场计入语言护照。</p>

  <!-- 对局台 -->
  <div class="card mt-xl">
    <div class="row" style="justify-content:space-around;align-items:flex-start;text-align:center;flex-wrap:wrap;gap:20px">
      <div>
        <span class="avatar" style="width:64px;height:64px;font-size:24px;margin:0 auto">林</span>
        <b class="small" style="display:block;margin-top:8px">你 · L2</b>
        <div class="display text-stamp mt-md" style="font-size:34px">92</div>
        <p class="tiny muted">发音分</p>
      </div>
      <div class="display" style="font-size:40px;padding-top:18px;color:var(--gold)">VS</div>
      <div>
        <span class="avatar ja" style="width:64px;height:64px;font-size:24px;margin:0 auto">芽</span>
        <b class="small" style="display:block;margin-top:8px">樱芽めい · L3</b>
        <div class="display muted-stamp mt-md" style="font-size:34px;color:var(--muted)">87</div>
        <p class="tiny muted">发音分</p>
      </div>
    </div>

    <div class="stamp-card mt-lg center" style="background:var(--paper)">
      <p class="tiny muted">本轮句子</p>
      <p class="serif mt-md" style="font-size:22px">I'd like to make a reservation for two at seven.</p>
      <button class="btn btn-ghost btn-sm mt-lg" data-play>▶ 听标准发音</button>
    </div>

    <div class="center mt-lg">
      <button class="btn btn-stamp btn-lg" data-mark="原型示意：录音识别后出分">🎙 轮到你跟读</button>
    </div>
  </div>

  <!-- 战绩 -->
  <div class="grid mt-xl" style="grid-template-columns:repeat(3,1fr);gap:14px">
    <div class="stamp-card center"><div class="display text-stamp" style="font-size:28px">18</div><p class="tiny muted mt-md">本赛季胜</p></div>
    <div class="stamp-card center"><div class="display" style="font-size:28px;color:var(--ok)">9</div><p class="tiny muted mt-md">负</p></div>
    <div class="stamp-card center"><div class="display text-gold" style="font-size:28px">黄金 III</div><p class="tiny muted mt-md">当前段位</p></div>
  </div>

  <p class="tiny muted center mt-lg">仅同级别匹配；比分只反映发音相似度，不评价内容对错。</p>
  <div style="height:30px"></div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
