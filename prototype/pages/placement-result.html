<!DOCTYPE html>

<body data-phase="m">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">

    <p class="tiny muted" style="letter-spacing:.3em">定级完成</p>
    <div class="rubber stamp-anim ink lg" style="margin:20px auto 0"><span class="r-main">L2</span><span class="r-date">STARTER+</span></div>

        <p class="tiny muted">语法掌握</p>
        <b class="serif-cn" style="font-size:20px">中等</b>

      </div>

    <div class="mt-xl col gap-md">
      <a class="btn btn-stamp btn-lg btn-block" href="course-map.html">好，从 L2 第 3 课开始</a>
      <a class="btn btn-ghost btn-block" href="lesson.html">我想从 L1 打牢基础</a>
    </div>
    <p class="tiny muted mt-lg">定级结果随时可在课程中心重新测试更新。</p>
  </div>
