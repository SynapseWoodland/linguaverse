<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进度仪表盘 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-shell="app" data-nav="dashboard" data-phase="m">
<div class="wrap" style="padding-top:30px;max-width:1020px">
  <h1 class="serif-cn" style="font-size:28px">我的护照 · 学习仪表盘</h1>
  <p class="muted small mt-md">林小野 · 加入 46 天 · 总 XP 3,820</p>

  <div class="grid mt-xl" style="grid-template-columns:repeat(4,1fr);gap:16px">
    <div class="stamp-card center"><div class="display text-stamp" style="font-size:32px">15</div><p class="tiny muted mt-md">连续学习天数</p></div>
    <div class="stamp-card center"><div class="display" style="font-size:32px;color:var(--passport)">404</div><p class="tiny muted mt-md">累计掌握单词</p></div>
    <div class="stamp-card center"><div class="display" style="font-size:32px;color:var(--ok)">86%</div><p class="tiny muted mt-md">近 30 题平均正确率</p></div>
    <div class="stamp-card center"><div class="display text-gold" style="font-size:32px">32h</div><p class="tiny muted mt-md">累计学习时长</p></div>
  </div>

  <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px">
    <!-- 学习热力格 -->
    <div class="card">
      <p class="tiny muted" style="letter-spacing:.2em">近 12 周学习足迹（颜色越深学得越多）</p>
      <div class="mt-lg" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px">
      </div>
      <div id="heat" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px"></div>
      <div class="row-between tiny muted mt-md"><span>少</span><span>周一至周日 · 共 84 格</span><span>多</span></div>
    </div>

    <!-- XP 趋势 -->
    <div class="card">
      <p class="tiny muted" style="letter-spacing:.2em">近 7 天 XP</p>
      <svg viewBox="0 0 300 160" style="width:100%;height:auto" class="mt-md">
        <line x1="30" y1="130" x2="290" y2="130" stroke="#D6D1C2"/>
        <polyline points="36,108 78,96 120,70 162,86 204,40 246,58 288,30" fill="none" stroke="#28456E" stroke-width="2.5"/>
        <circle cx="288" cy="30" r="4.5" fill="#C2452F"/>
        <text x="36" y="150" font-size="9" fill="#6E7785" text-anchor="middle">一</text>
        <text x="78" y="150" font-size="9" fill="#6E7785" text-anchor="middle">二</text>
        <text x="120" y="150" font-size="9" fill="#6E7785" text-anchor="middle">三</text>
        <text x="162" y="150" font-size="9" fill="#6E7785" text-anchor="middle">四</text>
        <text x="204" y="150" font-size="9" fill="#6E7785" text-anchor="middle">五</text>
        <text x="246" y="150" font-size="9" fill="#6E7785" text-anchor="middle">六</text>
        <text x="288" y="150" font-size="9" fill="#C2452F" text-anchor="middle" style="font-weight:700">今</text>
      </svg>
      <p class="small mt-md">本周累计 <b class="text-stamp">268 XP</b>，比上周多 12%。</p>
    </div>
  </div>

  <!-- 语种进度 -->
  <h2 class="serif-cn mt-xl" style="font-size:20px">各语种护照页</h2>
  <div class="grid mt-lg" style="grid-template-columns:repeat(3,1fr);gap:16px">
    <a class="card" href="course-map.html">
      <div class="row-between"><b class="small">英语</b><span class="tiny muted">L2 · 42%</span></div>
      <div class="bar mt-md"><i style="width:42%;background:var(--lang-en)"></i></div>
      <p class="tiny muted mt-md">218 词 · 6 课时 · 正确率 88%</p>
    </a>
    <a class="card" href="course-map.html">
      <div class="row-between"><b class="small">日语</b><span class="tiny muted">L2 · 40%</span></div>
      <div class="bar mt-md"><i class="ko-fill" style="width:40%"></i></div>
      <p class="tiny muted mt-md">186 词 · 5 课时 · 正确率 79%</p>
    </a>
    <a class="card" href="courses.html">
      <div class="row-between"><b class="small">韩语</b><span class="tiny muted">未开始</span></div>
      <div class="bar mt-md"><i style="width:0"></i></div>
      <p class="tiny muted mt-md">还没有印章</p>
    </a>
  </div>

  <div class="row gap-md mt-xl" style="flex-wrap:wrap">
    <a class="btn btn-ghost btn-sm" href="achievements.html">查看成就墙</a>
    <a class="btn btn-ghost btn-sm" href="leaderboard.html">查看排行榜</a>
    <a class="btn btn-ghost btn-sm" href="data-export.html">导出我的学习数据</a>
    <a class="btn btn-ghost btn-sm" href="certificate.html">学习证书</a>
  </div>
  <div style="height:44px"></div>
</div>
<script src="../assets/app.js">
  // 渲染 84 格热力
  document.addEventListener('DOMContentLoaded',function(){
    const box=document.getElementById('heat');const shades=['var(--paper-deep)','rgba(40,69,110,.25)','rgba(40,69,110,.5)','rgba(40,69,110,.75)','var(--stamp)'];
    let html='';for(let i=0;i<84;i++){const lvl=[0,0,1,2,1,3,2,4][i%8]??0;html+=`<i style="aspect-ratio:1;border-radius:2px;background:${shades[lvl]}"></i>`;}box.innerHTML=html;
  });
</script>
</body>
</html>
