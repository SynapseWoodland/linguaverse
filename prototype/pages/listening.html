<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听力训练 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-phase="m">
<div style="max-width:680px;margin:0 auto;padding:24px 20px 60px">
  <div class="row-between tiny muted">
    <a href="lesson.html">← 返回课时</a>
    <span>听力 · At the Coffee Shop</span>
  </div>
  <h1 class="serif-cn mt-md" style="font-size:24px">咖啡店对话 · 听力训练</h1>

  <!-- 播放器 -->
  <div class="card mt-lg">
    <div class="row gap-lg" style="flex-wrap:wrap">
      <button class="btn btn-stamp" data-play>▶ 播放</button>
      <div style="flex:1;min-width:180px">
        <div style="display:flex;gap:3px;align-items:flex-end;height:34px">
          <i style="flex:1;background:var(--passport);height:40%;border-radius:2px"></i><i style="flex:1;background:var(--passport);height:70%"></i><i style="flex:1;background:var(--passport);height:55%"></i><i style="flex:1;background:var(--stamp);height:90%"></i><i style="flex:1;background:var(--thread);height:60%"></i><i style="flex:1;background:var(--thread);height:42%"></i><i style="flex:1;background:var(--thread);height:66%"></i><i style="flex:1;background:var(--thread);height:36%"></i><i style="flex:1;background:var(--thread);height:74%"></i><i style="flex:1;background:var(--thread);height:50%"></i><i style="flex:1;background:var(--thread);height:62%"></i><i style="flex:1;background:var(--thread);height:44%"></i>
        </div>
        <div class="row-between tiny muted mt-md"><span>0:14 / 0:38</span><span>整段对话</span></div>
      </div>
      <div class="row gap-sm">
        <span class="chip active">0.8×</span><span class="chip">1.0× 正常</span>
      </div>
    </div>

    <!-- 逐句 -->
    <div class="mt-lg col gap-sm">
      <div class="row gap-md stamp-card" style="padding:13px 16px">
        <button class="btn btn-ghost btn-sm" data-play>▶</button>
        <div><b class="serif small">Hi, what can I get for you?</b><p class="tiny muted mt-md">店员 · 正常语速可重播这一句</p></div>
        <span class="tiny text-ok" style="margin-left:auto">听懂了 ✓</span>
      </div>
      <div class="row gap-md stamp-card" style="padding:13px 16px;border:1.5px solid var(--stamp)">
        <button class="btn btn-stamp btn-sm" data-play>▶</button>
        <div><b class="serif small">Can I have a medium latte, please?</b><p class="tiny muted mt-md">当前句 · 慢速 0.8× 反复听</p></div>
      </div>
      <div class="row gap-md stamp-card" style="padding:13px 16px">
        <button class="btn btn-ghost btn-sm" data-play>▶</button>
        <div><b class="serif small">Sure. For here or to go?</b><p class="tiny muted mt-md">点播放再听</p></div>
      </div>
    </div>

    <div class="row gap-sm mt-lg">
      <button class="chip active">先盲听（原文隐藏）</button>
      <button class="chip" data-mark="原型示意：再次点击可对照原文">显示原文对照</button>
    </div>
  </div>

  <!-- 题目 -->
  <div class="card mt-xl">
    <p class="tiny muted">听完对话回答（不回播原文，凭记忆）</p>
    <h3 class="serif-cn mt-md" style="font-size:18px">点单的人想要什么？</h3>
    <div class="col gap-md mt-lg">
      <button class="btn btn-ghost" style="justify-content:flex-start;text-align:left" data-mark="原型演示">A. 一小杯美式</button>
      <button class="btn btn-primary" style="justify-content:flex-start;text-align:left" data-mark="回答后立刻显示解析">B. 一杯中杯拿铁</button>
      <button class="btn btn-ghost" style="justify-content:flex-start;text-align:left" data-mark="原型演示">C. 一杯大杯红茶</button>
    </div>
    <div class="row-between mt-lg">
      <span class="tiny muted">答错可以重听，不扣分</span>
      <a class="btn btn-stamp" href="speaking.html">完成听力，去口语 →</a>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
