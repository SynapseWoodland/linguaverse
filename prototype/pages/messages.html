<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息中心 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-shell="app" data-nav="home" data-phase="1">
<div class="wrap-narrow" style="padding-top:34px">
  <h1 class="serif-cn" style="font-size:28px">消息中心</h1>
  <div class="tabs mt-lg">
    <button class="active" data-tab="0">全部</button>
    <button data-tab="1">系统</button>
    <button data-tab="2">互动</button>
    <button data-tab="3">私信</button>
  </div>

  <div id="msg-panels">
    <div>
      <div class="stamp-card mt-lg">
        <div class="row gap-lg">
          <span class="rubber stamp-anim" style="--s:50px;flex:none"><span class="r-main">15D</span></span>
          <div style="flex:1"><b class="small">连续学习即将达成第 15 天</b><p class="tiny muted mt-md">今天再学 10 XP 就能解锁「勤学不辍」铜章。</p></div>
          <span class="tiny muted">刚刚</span>
        </div>
      </div>
      <div class="stamp-card mt-md">
        <div class="row gap-lg">
          <span class="avatar ja" style="flex:none">芽</span>
          <div style="flex:1"><b class="small">樱芽めい 回复了你的帖子</b><p class="tiny muted mt-md">「は和が那期我也卡了好久，多造句就好了！」</p></div>
          <span class="tiny muted">26 分钟前</span>
        </div>
      </div>
      <div class="stamp-card mt-md">
        <div class="row gap-lg">
          <span class="rubber ink sm" style="--s:50px;flex:none"><span class="r-main">REVIEW</span></span>
          <div style="flex:1"><b class="small">有 12 个单词到了复习时间</b><p class="tiny muted mt-md">按照遗忘曲线，现在复习记忆最牢固。</p></div>
          <span class="tiny muted">1 小时前</span>
        </div>
      </div>
      <div class="stamp-card mt-md">
        <div class="row gap-lg">
          <span class="avatar gold" style="flex:none">★</span>
          <div style="flex:1"><b class="small">你获得了新徽章：满分达人</b><p class="tiny muted mt-md">日语 L2 第 3 课听力全部答对。</p></div>
          <span class="tiny muted">昨天</span>
        </div>
      </div>
      <div class="stamp-card mt-md">
        <div class="row gap-lg">
          <span class="avatar" style="flex:none">系</span>
          <div style="flex:1"><b class="small">版本更新：L3 课程已全部上线</b><p class="tiny muted mt-md">英语 L3 新增 4 个真实场景课时，去课程地图看看。</p></div>
          <span class="tiny muted">昨天</span>
        </div>
      </div>
    </div>
  </div>

  <div class="row-between mt-lg">
    <a class="small muted" href="notification-settings.html">管理提醒方式 →</a>
    <a class="small text-stamp" href="messages-list.html">前往私信对话 →</a>
  </div>
  <div style="height:40px"></div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
