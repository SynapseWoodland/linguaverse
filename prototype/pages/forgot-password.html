<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-phase="1">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:440px">
    <div class="center"><a class="brand" style="justify-content:center;font-size:23px" href="landing.html"><span class="brand-mark">L</span>LinguaVerse</a></div>
    <h1 class="serif-cn center mt-lg" style="font-size:24px">找回密码</h1>

    <!-- 步骤指示（真实顺序：可用编号） -->
    <div class="row mt-lg" style="justify-content:center;gap:0">
      <span class="chip active">1 验证邮箱</span><span style="width:34px;border-top:2px solid var(--passport)"></span>
      <span class="chip">2 设置新密码</span><span style="width:34px;border-top:2px solid var(--thread)"></span>
      <span class="chip">3 完成</span>
    </div>

    <form class="card mt-lg" onsubmit="lvToast('演示原型：重置邮件已发送（P1 功能）');return false">
      <p class="small muted">输入注册时绑定的邮箱，我们会把重置链接发给你。链接 30 分钟内有效。</p>
      <div class="field mt-lg">
        <label>注册邮箱</label>
        <input class="input" type="email" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">发送重置链接</button>
    </form>

    <!-- 成功态（演示第二屏样式） -->
    <div class="card mt-md center hide" id="sent">
      <div class="rubber ink" style="--s:84px;margin:0 auto"><span class="r-main">SENT</span><span class="r-date">EMAIL</span></div>
      <p class="small mt-md">重置邮件已发送，请查收邮箱并在 30 分钟内完成重置。</p>
    </div>

    <p class="small muted center mt-lg"><a href="login.html">← 返回登录</a></p>
  </div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
