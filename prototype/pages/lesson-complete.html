<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课时完成 · 盖章时刻 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-phase="m">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px">
  <div style="max-width:560px;width:100%;text-align:center">

    <!-- 盖章时刻 -->
    <p class="tiny muted" style="letter-spacing:.35em">LESSON COMPLETE · 第 7 课</p>
    <div style="position:relative;height:190px;margin:18px 0 4px">
      <div class="rubber stamp-anim lg" style="margin:0 auto"><span class="r-main">STAMPED</span><span class="r-date">L2·U1·3 · 10.13</span></div>
    </div>
    <h1 class="display serif-cn" style="font-size:34px">这一站，盖过了。</h1>
    <p class="muted small mt-md">At the Coffee Shop · 听说读写四个环节全部完成</p>

    <!-- 成绩护照条 -->
    <div class="grid mt-xl" style="grid-template-columns:repeat(3,1fr);gap:14px">
      <div class="stamp-card" style="padding:20px 14px">
        <div class="display text-stamp" style="font-size:30px">+30</div>
        <p class="tiny muted mt-md">课时经验 XP</p>
      </div>
      <div class="stamp-card" style="padding:20px 14px">
        <div class="display" style="font-size:30px;color:var(--ok)">89%</div>
        <p class="tiny muted mt-md">四环节平均正确率</p>
      </div>
      <div class="stamp-card" style="padding:20px 14px">
        <div class="display text-gold" style="font-size:30px">8 / 8</div>
        <p class="tiny muted mt-md">新单词全部过卡</p>
      </div>
    </div>

    <!-- SRS 安排 -->
    <div class="card mt-lg" style="text-align:left">
      <p class="tiny muted" style="letter-spacing:.2em">复习安排已写入护照</p>
      <div class="row gap-lg mt-md" style="flex-wrap:wrap">
        <span class="chip">今天再出现 · 1 词</span>
        <span class="chip">明天到期 · 3 词</span>
        <span class="chip" style="border-color:var(--ok);color:var(--ok)">3 天后 · 4 词</span>
      </div>
      <div class="mt-lg row gap-md">
        <span class="rubber ink sm stamp-anim" style="--s:58px;flex:none"><span class="r-main">15D</span></span>
        <div><b class="small">连续学习达到 15 天！解锁徽章「勤学不辍」</b>
        <p class="tiny muted mt-md">徽章已贴到你的成就墙。</p></div>
      </div>
    </div>

    <div class="mt-xl row gap-md" style="justify-content:center;flex-wrap:wrap">
      <a class="btn btn-stamp btn-lg" href="course-map.html">前往下一站：On the Street</a>
      <a class="btn btn-ghost btn-lg" href="review.html">先复习到期单词</a>
    </div>
    <p class="tiny muted mt-lg">成绩已保存，即使现在关掉页面也不会重复计分。</p>
  </div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
