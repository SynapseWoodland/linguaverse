<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户与安全 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-shell="app" data-nav="dashboard" data-phase="1">
<div class="wrap-narrow" style="padding-top:30px">
  <a class="tiny muted" href="profile.html">← 个人资料</a>
  <h1 class="serif-cn mt-md" style="font-size:26px">账户与安全</h1>

  <div class="card mt-lg">
    <p class="tiny muted" style="letter-spacing:.2em">登录信息</p>
    <div class="kv mt-md"><b class="small">用户名</b><span class="small mono">linxiaoye</span></div>
    <div class="kv"><b class="small">绑定邮箱</b><div class="row gap-sm"><span class="small">li***@example.com</span><button class="btn btn-ghost btn-sm" data-mark="原型示意：发送验证邮件">更换</button></div></div>
    <div class="kv"><b class="small">密码</b><div class="row gap-sm"><span class="small muted">已设置 · 上次修改 32 天前</span><button class="btn btn-ghost btn-sm" data-mark="原型示意：修改密码弹层">修改密码</button></div></div>
    <div class="kv"><b class="small">登录设备</b><span class="small text-ok">当前 2 台可信设备</span></div>
  </div>

  <!-- 修改密码弹层（静态展开示意） -->
  <div class="card mt-md">
    <p class="tiny muted" style="letter-spacing:.2em">修改密码</p>
    <div class="field mt-md"><label>当前密码</label><input class="input" type="password" placeholder="为安全起见需验证"></div>
    <div class="field"><label>新密码</label><input class="input" type="password" placeholder="至少 6 位"></div>
    <div class="field"><label>再输一次新密码</label><input class="input" type="password" placeholder="确认新密码"></div>
    <button class="btn btn-primary btn-sm" data-mark="密码已更新，其他设备需重新登录">更新密码</button>
  </div>

  <div class="card mt-md">
    <p class="tiny muted" style="letter-spacing:.2em">危险操作</p>
    <div class="kv mt-md"><div><b class="small">重置学习进度</b><p class="tiny muted">清空所有课时、XP、徽章与记忆曲线，重新开始</p></div><button class="btn btn-ghost btn-sm" style="color:var(--warn)" data-mark="原型示意：二次确认弹窗">申请重置</button></div>
    <div class="kv"><div><b class="small text-stamp">注销账户</b><p class="tiny muted">30 天冷静期内可恢复；到期后数据彻底删除</p></div><button class="btn btn-danger btn-sm" data-mark="原型示意：注销说明弹窗">注销</button></div>
  </div>

  <p class="tiny muted mt-lg">想带走数据再离开？可先在 <a class="text-stamp" href="data-export.html">数据导出</a> 下载完整学习记录。</p>
  <div style="height:44px"></div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
