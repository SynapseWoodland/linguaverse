<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私信 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-shell="app" data-nav="home" data-phase="1">
<div class="wrap-narrow" style="padding-top:30px">
  <div class="row-between">
    <h1 class="serif-cn" style="font-size:26px">私信</h1>
    <a class="tiny muted" href="messages.html">系统消息 →</a>
  </div>

  <div class="card mt-lg card-flush" style="padding:0 0 6px">
    <a class="row gap-lg card" href="chat.html" style="box-shadow:none;border-radius:0;border:0;border-bottom:var(--hairline);margin:0;padding:18px 22px">
      <span class="avatar ja" style="flex:none">芽</span>
      <div style="flex:1;min-width:0">
        <div class="row-between"><b class="small">樱芽めい</b><span class="tiny muted">刚刚</span></div>
        <p class="small muted mt-md" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">那我把自己造的三个句子发你，你帮我看看对不对～</p>
      </div>
      <span class="badge-dot" style="background:var(--stamp)"></span>
    </a>
    <a class="row gap-lg card" href="chat.html" style="box-shadow:none;border-radius:0;border:0;border-bottom:var(--hairline);margin:0;padding:18px 22px">
      <span class="avatar ko" style="flex:none">俊</span>
      <div style="flex:1;min-width:0">
        <div class="row-between"><b class="small">俊介君</b><span class="tiny muted">昨天</span></div>
        <p class="small muted mt-md" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">明天口语 PK 还约吗？我练了一下 reservation 这句</p>
      </div>
    </a>
    <div class="row gap-lg" style="padding:18px 22px;opacity:.6">
      <span class="avatar" style="flex:none;background:#8a93a0">桥</span>
      <div style="flex:1;min-width:0">
        <div class="row-between"><b class="small">桥本太太</b><span class="tiny muted">周一</span></div>
        <p class="small muted mt-md" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">不客气，が作对象助词的用法你已经掌握啦</p>
      </div>
    </div>
  </div>

  <p class="tiny muted center mt-xl">私信只属于你们双方；遇到骚扰可直接<a href="report.html" class="text-stamp">举报并屏蔽</a>。</p>
  <div style="height:44px"></div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
