<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-shell="app" data-nav="dashboard" data-phase="1">
<div class="wrap" style="padding-top:32px;max-width:920px">
  <h1 class="serif-cn" style="font-size:28px">我的收藏</h1>
  <div class="tabs mt-lg">
    <button class="active">句子 4</button>
    <button>单词 7</button>
    <button>课时 2</button>
    <button>帖子 3</button>
  </div>

  <div class="grid mt-lg" style="grid-template-columns:1fr 1fr;gap:16px">
    <div class="stamp-card">
      <div class="row-between"><span class="chip chip-lang-en active">ENGLISH · L2</span><span class="text-gold">★</span></div>
      <p class="serif mt-md" style="font-size:17px">“Can I have a medium latte, please?”</p>
      <p class="tiny muted mt-md">请给我一杯中杯拿铁。 · At the Coffee Shop</p>
      <div class="row gap-sm mt-md"><button class="btn btn-ghost btn-sm" data-play>▶ 播放</button><button class="btn btn-ghost btn-sm" data-mark="已加入复习队列">加入复习</button></div>
    </div>
    <div class="stamp-card">
      <div class="row-between"><span class="chip chip-lang-ja active">日本語 · L2</span><span class="text-gold">★</span></div>
      <p class="serif mt-md" style="font-size:17px;font-family:'Noto Sans JP',serif">「すみません、切符はどこで買えますか。」</p>
      <p class="tiny muted mt-md">请问车票在哪里买？ · 在车站</p>
      <div class="row gap-sm mt-md"><button class="btn btn-ghost btn-sm" data-play>▶ 播放</button><button class="btn btn-ghost btn-sm" data-mark="已加入复习队列">加入复习</button></div>
    </div>
    <div class="stamp-card">
      <div class="row-between"><span class="chip chip-lang-en active">ENGLISH · L1</span><span class="text-gold">★</span></div>
      <p class="serif mt-md" style="font-size:17px">“What time is it?” “It's half past seven.”</p>
      <p class="tiny muted mt-md">几点了？七点半。 · 数字与时间</p>
      <div class="row gap-sm mt-md"><button class="btn btn-ghost btn-sm" data-play>▶ 播放</button><button class="btn btn-ghost btn-sm" data-mark="已取消收藏">取消收藏</button></div>
    </div>
    <div class="stamp-card">
      <div class="row-between"><span class="chip chip-lang-ja active">日本語 · L2</span><span class="text-gold">★</span></div>
      <p class="serif mt-md" style="font-size:17px;font-family:'Noto Sans JP',serif">「コンビニは駅の前にあります。」</p>
      <p class="tiny muted mt-md">便利店在车站前面。 · 方位表达</p>
      <div class="row gap-sm mt-md"><button class="btn btn-ghost btn-sm" data-play>▶ 播放</button><button class="btn btn-ghost btn-sm" data-mark="已加入复习队列">加入复习</button></div>
    </div>
  </div>
  <div style="height:44px"></div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
