<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索 · LinguaVerse</title>
<link rel="stylesheet" href="../assets/passport.css">
</head>
<body data-shell="app" data-nav="courses" data-phase="1">
<div class="wrap-narrow" style="padding-top:32px">
  <h1 class="serif-cn" style="font-size:26px">搜索</h1>
  <div class="row gap-md mt-lg">
    <input class="input" placeholder="搜单词、句子、课时或帖子…" value="reservation" autofocus>
    <button class="btn btn-primary" data-mark="原型示意：正在搜索">搜索</button>
  </div>
  <div class="row gap-sm mt-md tiny muted"><span>热门：</span><a class="chip">て形</a><a class="chip">发音规则</a><a class="chip">助词</a><a class="chip">自我介绍</a></div>

  <div class="tabs mt-xl">
    <button class="active">单词 3</button>
    <button>课时 1</button>
    <button>社区 2</button>
  </div>

  <div class="mt-lg col gap-md">
    <a class="stamp-card row gap-lg" href="vocabulary-book.html">
      <span class="rubber ink sm" style="--s:52px;flex:none"><span class="r-main">EN</span></span>
      <div style="flex:1"><b class="serif" style="font-size:18px">reservation</b><p class="tiny muted mt-md">/ˌrezərˈveɪʃn/ · 名词 · 预订；预约</p>
      <p class="tiny mt-md">I'd like to make a <b class="text-stamp">reservation</b> for two.（我想订两个人的位。）</p></div>
      <span class="tiny muted">英语 L2</span>
    </a>
    <div class="stamp-card row gap-lg">
      <span class="rubber sm" style="--s:52px;flex:none;color:var(--lang-ja)"><span class="r-main">日</span></span>
      <div style="flex:1"><b class="serif" style="font-size:17px;font-family:'Noto Sans JP',serif">予約（よやく）</b><p class="tiny muted mt-md">名词 · 预约、预订（和 reservation 对应）</p></div>
      <span class="tiny muted">日本語 L2</span>
    </div>
    <div class="stamp-card row gap-lg">
      <span class="rubber sm" style="--s:52px;flex:none;color:var(--lang-ko)"><span class="r-main">한</span></span>
      <div style="flex:1"><b class="serif" style="font-size:17px;font-family:'Noto Sans KR',sans-serif">예약</b><p class="tiny muted mt-md">名词 · 预订、预约</p></div>
      <span class="tiny muted">한국어 L2</span>
    </div>
  </div>

  <p class="tiny muted center mt-xl">搜索结果仅来自你可学习的内容；搜索词不会被记录为公开内容。</p>
  <div style="height:44px"></div>
</div>
<script src="../assets/app.js"></script>
</body>
</html>
