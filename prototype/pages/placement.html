<div class="wrap-narrow" style="padding:36px 24px 80px">

  <div class="bar mt-lg"><i class="stamp-fill" style="width:40%"></i></div>

    <h2 class="serif-cn mt-lg" style="font-size:23px">选择句子中 <span class="text-stamp italic">reservation</span> 的含义</h2>

      <p class="serif" style="font-size:20px;line-height:1.7">“I'd like to make a <b class="text-stamp">reservation</b> for two people at 7 p.m.”</p>
    </div>

    <div class="col gap-md mt-xl">
      <button class="btn btn-ghost" style="justify-content:flex-start" data-mark="答题不会即时显示对错以外的反馈，提交后统一计算级别">A. 投诉</button>

      <button class="btn btn-ghost" style="justify-content:flex-start">D. 退货</button>
    </div>

    <div class="row-between mt-xl">
      <button class="btn btn-ghost" data-mark="原型示意：上一题">← 上一题</button>
      <a class="btn btn-stamp" href="placement-result.html">下一题 →</a>

  <p class="tiny muted center mt-lg">凭直觉作答即可，不会做的题选择「不知道」比猜更准确定级。答案不会在题目中下发。</p>
